[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-exclude-search"
version = "0.6.7"
description = "A mkdocs plugin that lets you exclude selected files or sections from the search index."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christoph Rieke", email = "christoph.k.rieke@gmail.com" }]
keywords = ["mkdocs"]
requires-python = ">=3.9"
dependencies = ["mkdocs>=1.0.4", "packaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/chrieke/mkdocs-exclude-search"

[project.entry-points."mkdocs.plugins"]
exclude-search = "mkdocs_exclude_search:ExcludeSearch"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]
